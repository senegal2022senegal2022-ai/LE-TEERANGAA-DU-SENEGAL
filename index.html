<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sma Tégue – La Tégue digitale par Khalil Mbacké</title>
<style>
:root{--g:#0b5d3b;--g2:#0e7a4e;--gd:#d4a937;--bg:#f6f8f5;--c:#fff;--t:#14231b;--m:#5d6f65;--b:#dfe7e1;--r:#c0392b;--o:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1612;--c:#16231c;--t:#e8f0ea;--m:#9db0a4;--b:#27382e}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:#fff;text-decoration:none}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}nav a{color:#e6f2ea;text-decoration:none;padding:6px 12px;border-radius:8px}nav a.on,nav a:hover{background:rgba(255,255,255,.15);color:#fff}
.role{display:flex;gap:4px;background:rgba(0,0,0,.2);padding:3px;border-radius:9px}.role button{border:0;background:none;color:#fff;padding:4px 10px;border-radius:7px;cursor:pointer}.role button.on{background:var(--gd);color:#1a1400;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:20px;padding:48px 28px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(30px,6vw,52px)}.hero h1 span{color:var(--gd)}.hero p{max-width:620px;margin:8px auto 22px;color:#e1efe6;font-size:17px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--g);color:#fff;margin:3px}
.btn.gold{background:var(--gd);color:#1a1400}.btn.out{background:none;border:1.5px solid #fff;color:#fff}.btn.sm{padding:5px 10px;font-size:13px}.btn.ghost{background:none;color:var(--g);border:1.5px solid var(--b)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:18px 0}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px}.card h3{margin:0 0 6px}
.kpi b{display:block;font-size:26px;color:var(--g2)}.kpi span{color:var(--m);font-size:13px}
h2{margin:26px 0 10px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--b);white-space:nowrap}th{color:var(--m);font-size:12px;text-transform:uppercase}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.paid{background:#d9f2e3;color:#0b5d3b}.pending{background:#fdf0d0;color:#8a5a00}.late{background:#fbdcd8;color:#a32a1d}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gd);color:#1a1400;font-weight:700;margin-right:8px;vertical-align:middle}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.stage{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);justify-items:center;background:#0a3b27;border-radius:20px;padding:24px;color:#fff;text-align:center}
.wheelbox{position:relative;width:min(100%,380px)}canvas{width:100%;height:auto;display:block}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px;color:var(--gd);filter:drop-shadow(0 2px 2px #000)}
.win{animation:pop .6s ease;background:var(--gd);color:#1a1400;border-radius:16px;padding:16px 26px;font-size:22px;font-weight:700}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;background:var(--g2);border-radius:6px 6px 0 0;position:relative;min-height:2px}.bars small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:var(--m);font-size:10px}
.mono{font:11px ui-monospace,monospace;color:var(--m);word-break:break-all}.note{background:#fdf0d0;color:#6b4800;border-radius:10px;padding:10px 14px;font-size:13px;margin:12px 0}
footer{text-align:center;color:var(--m);padding:30px 16px;font-size:13px}
html{-webkit-text-size-adjust:100%}
button,a.btn,select{touch-action:manipulation}
@media(max-width:640px){
body{font-size:14.5px}
header{padding:8px 12px;gap:8px}
.logo{font-size:16px}
.role{margin-left:auto}
nav{order:3;width:100%;flex:none;flex-wrap:nowrap;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav a{white-space:nowrap;padding:8px 12px}
main{padding:14px 12px 40px}
.hero{padding:30px 16px;border-radius:16px}
.hero p{font-size:15px}
.hero .btn{display:block;width:100%;margin:8px 0}
.grid{grid-template-columns:1fr 1fr;gap:10px}
.card{padding:14px}
.kpi b{font-size:19px;word-break:break-word}
.kpi span{font-size:12px}
th,td{padding:8px 6px;font-size:13px}
.btn{padding:11px 16px;min-height:44px}
.btn.sm{min-height:36px;padding:6px 10px}
.row{gap:8px}
.row input,.row select{flex:1 1 100%;min-height:44px;font-size:16px;width:100%}
.row .btn{flex:1 1 100%;margin:0}
input,select{font-size:16px}
#go{width:100%}
.stage{padding:16px 10px;border-radius:16px}
.win{font-size:18px;padding:12px 16px}
.av{width:28px;height:28px;margin-right:6px;font-size:12px}
h2{font-size:20px}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,169,55,.65)}70%{box-shadow:0 0 0 14px rgba(212,169,55,0)}}
.homefx .hero{position:relative;overflow:hidden}
.homefx .hero>*{position:relative;z-index:1}
.homefx .hero>.orbs{position:absolute;inset:0;z-index:0;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;background:rgba(212,169,55,.22);animation:floaty 6s ease-in-out infinite}
.orbs i:nth-child(1){width:64px;height:64px;left:6%;top:14%}
.orbs i:nth-child(2){width:38px;height:38px;right:9%;top:22%;animation-delay:1.2s;animation-duration:5s}
.orbs i:nth-child(3){width:90px;height:90px;right:16%;bottom:-24px;animation-delay:.6s;animation-duration:7s}
.orbs i:nth-child(4){width:28px;height:28px;left:18%;bottom:14%;animation-delay:2s;animation-duration:4.5s}
.wheelbox{position:relative;width:112px;height:112px;margin:0 auto 16px}
.ptr2{position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:#d4a937;font-size:22px;z-index:2}
.wheel{width:112px;height:112px;border-radius:50%;border:5px solid #d4a937;background:conic-gradient(#d4a937 0 12.5%,#fff 0 25%,#0e7a4e 0 37.5%,#fff 0 50%,#d4a937 0 62.5%,#fff 0 75%,#0e7a4e 0 87.5%,#fff 0 100%);animation:spin 12s linear infinite;position:relative}
.wheel::after{content:"";position:absolute;inset:38px;border-radius:50%;background:#d4a937;border:3px solid #fff}
.homefx .hero h1{animation:fadeup .8s .1s ease backwards}
.homefx .hero p{animation:fadeup .8s .3s ease backwards}
.homefx .hero .btn{animation:fadeup .8s .5s ease backwards}
.homefx .hero .btn.gold{animation:fadeup .8s .5s ease backwards,pulse 2.4s 1.6s infinite}
.homefx .grid .card,.homefx>.card{animation:fadeup .7s ease backwards;transition:transform .25s}
.homefx .grid .card:nth-child(2){animation-delay:.12s}.homefx .grid .card:nth-child(3){animation-delay:.24s}.homefx .grid .card:nth-child(4){animation-delay:.36s}
.homefx .grid .card:hover{transform:translateY(-4px)}
@media(prefers-reduced-motion:reduce){.homefx *,.wheel,.orbs i{animation:none!important}}
.hero2{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:34px 22px;display:grid;gap:26px;align-items:center;grid-template-columns:1fr}
@media(min-width:820px){.hero2{grid-template-columns:1.15fr .85fr;padding:54px 50px}}
.hero2>*{position:relative;z-index:1}.hero2>.orbs{position:absolute;inset:0;z-index:0;pointer-events:none}
.badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(212,169,55,.7);color:#f3e2a6;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;margin-bottom:12px}
.hero2 h1{margin:0 0 8px;font-size:clamp(36px,7vw,60px);line-height:1.05}.hero2 h1 span{color:var(--gd)}
.hero2 .lead{font-size:clamp(16px,2.6vw,20px);margin:6px 0 4px}.hero2 p{color:#e1efe6;margin:6px 0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.btn.big{padding:14px 24px;font-size:17px;border-radius:14px;margin:0}
a.btn{text-decoration:none}
@media(max-width:640px){.homefx .grid{grid-template-columns:1fr}}
.btn.white{background:#fff;color:var(--g);border:2px solid var(--gd)}
@keyframes pulsew{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.homefx .hero2 .btn.gold{animation:fadeup .8s .5s ease backwards,pulse 2.4s 1.6s infinite}
.homefx .hero2 .btn.white{animation:fadeup .8s .65s ease backwards,pulsew 2.4s 2s infinite}
.homefx .hero2 .badge,.homefx .hero2 h1,.homefx .hero2 p{animation:fadeup .8s ease backwards}.homefx .hero2 h1{animation-delay:.1s}.homefx .hero2 p{animation-delay:.3s}
.visual{position:relative;width:250px;height:250px;margin:0 auto;display:grid;place-items:center}
.visual .ring{position:absolute;inset:0;border-radius:50%;border:6px solid #d4a937;background:conic-gradient(#d4a937 0 12.5%,rgba(255,255,255,.92) 0 25%,#0e7a4e 0 37.5%,rgba(255,255,255,.92) 0 50%,#d4a937 0 62.5%,rgba(255,255,255,.92) 0 75%,#0e7a4e 0 87.5%,rgba(255,255,255,.92) 0 100%);animation:spin 18s linear infinite;opacity:.9}
.visual img{position:relative;width:176px;height:176px;border-radius:28px;border:3px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.4);animation:floaty 5s ease-in-out infinite}
.strip{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:18px 0}
.strip div{background:var(--c);border:1px solid var(--b);border-left:5px solid var(--gd);border-radius:12px;padding:12px 14px;font-weight:600}
.steps{display:grid;gap:22px 14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:26px 0 14px}
.steps .st{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:26px 16px 16px;position:relative}
.steps .st h3{margin:0 0 4px}
.steps .n{position:absolute;top:-17px;left:16px;width:36px;height:36px;border-radius:50%;background:var(--gd);color:#1a1400;display:grid;place-items:center;font-weight:800}
.homefx .steps .st{animation:fadeup .7s ease backwards;transition:transform .25s}.homefx .steps .st:nth-child(2){animation-delay:.12s}.homefx .steps .st:nth-child(3){animation-delay:.24s}.homefx .steps .st:nth-child(4){animation-delay:.36s}.homefx .steps .st:hover{transform:translateY(-4px)}
@media(max-width:640px){.hero2 .cta .btn{flex:1 1 100%;text-align:center}.visual{width:210px;height:210px}.visual img{width:148px;height:148px}.hero2{padding:28px 18px}}
.home3 h1,.home3 h2,.home3 h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}
.hero3{position:relative;overflow:hidden;border-radius:20px;background:#0a4a32;color:#fff;padding:30px 20px;display:grid;gap:24px;grid-template-columns:1fr;align-items:center}
@media(min-width:820px){.hero3{grid-template-columns:1.2fr 1fr;padding:52px 46px;gap:42px}}
.hero3>*{position:relative;z-index:1}.hero3>.orbs{position:absolute;inset:0;z-index:0;pointer-events:none}
.eyebrow{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--g2);margin-bottom:10px}
.eyebrow.gold{color:#d9bf6a}
.hero3 h1{font-size:clamp(34px,6vw,54px);line-height:1.08;margin:0 0 14px}.hero3 h1 em{font-style:normal;color:#e6cf85}
.hero3 p{color:#dcebe1;max-width:480px}
.dots{list-style:none;padding:0;margin:14px 0 0;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#dcebe1}.dots li:before{content:"•";color:#d4a937;margin-right:6px}
.startcard{background:#fbf7ee;color:#14231b;border-radius:16px;padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.startcard .eyebrow{color:#0b5d3b}.startcard h2{font-size:26px;line-height:1.15;margin:0 0 8px;color:#0b4a32}.startcard p{color:#4a5f54;margin:0 0 4px}
.startcard .btn{display:block;text-align:center;margin:12px 0 0;width:100%}
.btn.dark{background:#0a2b1e;color:#fff}
.startcard .or{text-align:center;color:#8aa093;font-size:12px;margin:8px 0 0}
.startcard .small{font-size:13px;margin:8px 0 0}
.member{border-top:1px solid #e3dcc9;margin-top:14px;padding-top:12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.member a{color:#0b5d3b;font-weight:700;text-decoration:none}
.how{margin:34px 0 10px}.how-h{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}.how-h h2{font-size:clamp(28px,4.6vw,40px);margin:0}.how-h p{max-width:300px;color:var(--m);font-size:14px;margin:0}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:22px;border-top:1px solid var(--b);padding-top:20px}
.steps4 b{font-family:Georgia,serif;font-size:26px;font-weight:400;color:var(--m);display:block}.steps4 h3{font-size:15px;font-family:inherit;font-weight:700;margin:8px 0 4px}.steps4 p{color:var(--m);font-size:13.5px;margin:0}
@media(max-width:820px){.steps4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.steps4{grid-template-columns:1fr}}
.trust{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:26px;display:grid;grid-template-columns:1fr 1.5fr;gap:30px;margin:22px 0}
@media(max-width:820px){.trust{grid-template-columns:1fr}}
.trust h2{font-size:clamp(26px,4vw,34px);margin:0 0 8px}.trust p{color:var(--m);margin:0}
.trust ul{list-style:none;margin:0;padding:0;display:grid;gap:16px}.trust li{display:flex;gap:12px}.trust li i{flex:none;width:26px;height:26px;border-radius:50%;background:#dcefe3;color:#0b5d3b;display:grid;place-items:center;font-style:normal;font-size:13px}.trust li b{display:block}.trust li span{color:var(--m);font-size:13.5px}

.by{font-size:13px;color:var(--m)}.slogan{font-family:Georgia,serif;font-style:italic;color:var(--g2);text-align:center;margin:18px 0 0}
.homefx .hero3 .h3t>*{animation:fadeup .8s ease backwards}.homefx .hero3 .h3t>*:nth-child(2){animation-delay:.12s}.homefx .hero3 .h3t>*:nth-child(3){animation-delay:.24s}.homefx .hero3 .h3t>*:nth-child(4){animation-delay:.36s}
.homefx .startcard{animation:fadeup .9s .25s ease backwards}.homefx .startcard .btn.gold{animation:pulse 2.4s 1.4s infinite}
.homefx .steps4>div{animation:fadeup .7s ease backwards}.homefx .steps4>div:nth-child(2){animation-delay:.1s}.homefx .steps4>div:nth-child(3){animation-delay:.2s}.homefx .steps4>div:nth-child(4){animation-delay:.3s}
.hl{border:2px solid var(--gd);background:linear-gradient(180deg,rgba(212,169,55,.14),transparent);border-radius:16px;padding:16px;margin:14px 0}.hl h2{margin:0 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chips button{border:1px solid var(--b);background:var(--c);color:var(--g);border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.sec{margin-top:18px;scroll-margin-top:72px}

function draw(t){const c=$('#cv'),x=c.getContext('2d'),el=eligible(t),n=Math.max(el.length,1),R=380;x.clearRect(0,0,760,760);
for(let i=0;i<n;i++){const a0=ang+i*2*Math.PI/n-Math.PI/2,a1=a0+2*Math.PI/n;x.beginPath();x.moveTo(R,R);x.arc(R,R,R-8,a0,a1);x.fillStyle=i%2?'#0e7a4e':'#f6f1de';x.fill();x.strokeStyle='#d4a937';x.lineWidth=4;x.stroke();
if(el[i]){x.save();x.translate(R,R);x.rotate((a0+a1)/2);x.fillStyle=i%2?'#fff':'#0b5d3b';x.font='bold 30px system-ui';x.textAlign='right';x.fillText(el[i].name.split(' ')[0],R-40,10);x.restore()}}
x.beginPath();x.arc(R,R,46,0,7);x.fillStyle='#d4a937';x.fill();x.fillStyle='#1a1400';x.font='bold 22px system-ui';x.textAlign='center';x.fillText('KM',R,R+8)}
async function launch(t){if(!isA()||spinning)return;const el=eligible(t);if(!el.length){$('#res').textContent='Aucun participant éligible : tous ont déjà gagné ou sont en retard.';return}
spinning=true;$('#go').disabled=true;$('#res').innerHTML='';
const idx=rnd(el.length),n=el.length,seg=2*Math.PI/n;
const target=-(idx+.5)*seg+ (rnd(1000)/1000-.5)*seg*.7;const start=ang,end=ang+(Math.PI*2*6)+((target-start)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
const t0=performance.now(),D=5500;
await new Promise(r=>{(function f(now){const p=Math.min((now-t0)/D,1),e=1-Math.pow(1-p,4);ang=start+(end-start)*e;draw(t);p<1?requestAnimationFrame(f):r()})(t0)});
spinning=false;const w=el[idx],time=new Date().toISOString(),pot=potDraw(t);
const prev=t.draws.length?t.draws[t.draws.length-1].hash:'GENESIS',rr=crypto.getRandomValues(new Uint32Array(2)).join('-');
const hash=await sha(prev+t.round+w.id+pot+time+rr);
t.draws.push({round:t.round,cycle:t.cycle||1,winner:w.id,pot,time,rand:rr,prev,hash});
notify(`Tirage du tour ${t.round} : ${w.name} reçoit ${fmt(pot)}.`);t.round++;save();
$('#res').innerHTML=`<div class="win">🎉 ${esc(w.name)} remporte ${fmt(pot)} !</div>`;
setTimeout(()=>{const keep=$('#res').innerHTML;salle();$('#res').innerHTML=keep},2500)}

function genCode(){if(!isA())return;const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=A[rnd(A.length)];const nme=(document.getElementById('cn')||{}).value||'';S.codes=S.codes||[];S.codes.push({code:c,name:nme.trim(),joined:[],time:new Date().toISOString()});save();admin()}

function addP(d,f,n){const x=new Date(d+'T00:00:00Z');if(isNaN(x))return null;if(f==='quotidienne')x.setUTCDate(x.getUTCDate()+n);else if(f==='hebdomadaire')x.setUTCDate(x.getUTCDate()+7*n);else if(f==='tous les 15 jours')x.setUTCDate(x.getUTCDate()+15*n);else if(f==='annuelle')x.setUTCFullYear(x.getUTCFullYear()+n);else x.setUTCMonth(x.getUTCMonth()+n);return x.toISOString().slice(0,10)}
const fd=s=>s?new Date(s+'T00:00:00Z').toLocaleDateString('fr-FR',{timeZone:'UTC'}):'–';
const periods=(t,total)=>t.amount>0?Math.min(nP(t),Math.floor(total/t.amount)):0;
function nP(t){if(!t.start||!t.end)return t.max||1;let n=0;while(n<4000&&addP(t.start,t.freq,n)<t.end)n++;return Math.max(n,1)}
function elapsed(t){const td=new Date().toISOString().slice(0,10);if(!t.start||td<t.start)return 0;let n=0;const P=nP(t);while(n<P&&addP(t.start,t.freq,n)<=td)n++;return n}

function cover(t,total){const c=t.amount,k=periods(t,total),P=nP(t);if(k===0)return`somme insuffisante pour 1 ${unit(t,1)} (${fmt(c)}) : il manque ${fmt(c-total)}`;const s=t.start||new Date().toISOString().slice(0,10),nx=addP(s,t.freq,k),last=addP(nx,'quotidienne',-1),reste=k>=P?0:total-k*c;return`couvre ${k} ${unit(t,k)}, jusqu’au ${fdl(last)}`+(reste>0?` · reste ${fmt(reste)} (il manque ${fmt(c-reste)} pour 1 ${unit(t,1)} de plus)`:'')+(total>=goalOf(t)?' · Tégue entièrement payée':k>=P?` · reste ${fmt(goalOf(t)-total)} à verser sur la cotisation totale`:`. Prochaine cotisation : le ${fdl(nx)}`)}

function recompute(t,id){const total=tot(t,id),k=periods(t,total);t.amt=t.amt||{};for(let r=1;r<=t.max;r++){const key=id+'_'+r;if(r<=k){t.pay[key]='paid';t.amt[key]=t.amount}else if(r===k+1&&total-k*t.amount>0){t.pay[key]='pending';t.amt[key]=total-k*t.amount}else{if(t.pay[key]==='paid')delete t.pay[key];delete t.amt[key]}}}

<div class="row"><input id="ed" type="date" value="${E.end}"><button class="btn ghost" id="eds">Changer la date de restitution</button></div>

<h2>Épargnants</h2><div class="card tw"><table><tr><th>Nom</th><th>Total déposé</th><th>Total retiré</th><th>Solde</th><th>Actions</th></tr>${E.mem.map(m=>{const d=sum(E.dep,m.id),o=sum(E.out,m.id),b=d-o;return`<tr><td><span class="av">${ini(m.name)}</span>${esc(m.name)}</td><td>${fmt(d)}</td><td>${fmt(o)}</td><td><b>${fmt(b)}</b></td><td style="white-space:normal;min-width:270px"><input type="number" id="ev_${m.id}" placeholder="Montant" style="width:110px"><button class="btn sm" onclick="epDep('${m.id}')">Déposer</button><div style="margin:6px 0"><input type="number" id="ew_${m.id}" placeholder="Somme à retirer" style="width:158px"><button class="btn sm" onclick="epW('${m.id}')">Retirer cette somme</button></div><button class="btn sm gold" ${b>0&&open?'':'disabled'} onclick="epOut('${m.id}')">${b>0?(open?'Restituer '+fmt(b):'Dispo. le '+fd(E.end)):'Soldé'}</button><button class="btn sm ghost" onclick="epDel(this,'${m.id}')">Retirer</button></td></tr>`}).join('')||'<tr><td colspan="5">Aucun épargnant pour l’instant.</td></tr>'}</table></div>
<h2>Historique</h2><div class="card tw"><table><tr><th>Date</th><th>Nom</th><th>Opération</th><th>Montant</th><th></th></tr>${E.dep.map(d=>({id:d.id,t:d.time,m:d.m,k:'Dépôt',a:d.amount})).concat(E.out.map(o=>({id:o.id,t:o.time,m:o.m,k:o.kind||'Restitution',a:o.amount}))).sort((x,y)=>y.t.localeCompare(x.t)).map(o=>`<tr><td>${new Date(o.t).toLocaleDateString('fr-FR')}</td><td>${esc((E.mem.find(m=>m.id===o.m)||{name:'?'}).name)}</td><td>${o.k}</td><td>${fmt(o.a)}</td><td>${o.k==='Dépôt'?`<button class="btn sm ghost" onclick="epCancel(this,'${o.id}')">Retirer ce dépôt</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Aucune opération.</td></tr>'}</table></div>
<h2>Épargnes retirées</h2><div class="card tw"><table><tr><th>Date du dépôt</th><th>Nom</th><th>Montant</th><th>Retiré le</th><th>Motif</th></tr>${(()=>{const rows=(E.wd||[]).map(w=>({d:w.dep,n:w.name,a:w.amount,t:w.time,k:w.kind})).concat(E.out.map(o=>({d:null,n:(E.mem.find(m=>m.id===o.m)||{name:'?'}).name,a:o.amount,t:o.time,k:o.kind||'Restitution'}))).sort((x,y)=>y.t.localeCompare(x.t));return rows.map(r=>`<tr><td>${r.d?new Date(r.d).toLocaleDateString('fr-FR'):'–'}</td><td>${esc(r.n)}</td><td>${fmt(r.a)}</td><td>${new Date(r.t).toLocaleDateString('fr-FR')}</td><td>${r.k}</td></tr>`).join('')||'<tr><td colspan="5">Aucune épargne retirée pour l’instant.</td></tr>'})()}</table></div>
${(E.rm||[]).length?`<h2>Épargnants retirés</h2><div class="card tw"><table><tr><th>Date</th><th>Nom</th><th>Déposé</th><th>Retiré</th><th>Solde au retrait</th></tr>${E.rm.map(r=>`<tr><td>${new Date(r.time).toLocaleDateString('fr-FR')}</td><td>${esc(r.name)}</td><td>${fmt(r.dep)}</td><td>${fmt(r.out)}</td><td>${fmt(r.dep-r.out)}</td></tr>`).join('')}</table></div>`:''}`;
$('#eds').onclick=()=>{const v=$('#ed').value;if(v){E.end=v;save();epargne()}};
$('#ea').onclick=()=>{const n=$('#en').value.trim();if(!n)return;E.mem.push({id:'e'+Date.now(),name:n,phone:$('#ep').value});save();epargne()}}
function epDep(id){if(!isA())return;const v=+document.getElementById('ev_'+id).value||0;if(v<=0)return;S.ep.dep.push({id:'d'+Date.now(),m:id,amount:v,time:new Date().toISOString()});save();epargne()}
function epOut(id){if(!isA())return;const E=S.ep;if(new Date().toISOString().slice(0,10)<E.end)return;const b=E.dep.filter(d=>d.m===id).reduce((s,d)=>s+d.amount,0)-E.out.filter(o=>o.m===id).reduce((s,o)=>s+o.amount,0);if(b<=0)return;E.out.push({id:'o'+Date.now(),m:id,amount:b,time:new Date().toISOString(),kind:'Restitution'});save();epargne()}
function epW(id){if(!isA())return;const E=S.ep,v=+document.getElementById('ew_'+id).value||0,m=document.getElementById('epm'),bal=E.dep.filter(d=>d.m===id).reduce((s,d)=>s+d.amount,0)-E.out.filter(o=>o.m===id).reduce((s,o)=>s+o.amount,0);if(v<=0){m.textContent='Écrivez la somme à retirer.';return}if(v>bal){m.textContent='Impossible : le solde n’est que de '+fmt(bal)+'.';return}E.out.push({id:'o'+Date.now(),m:id,amount:v,time:new Date().toISOString(),kind:'Retrait'});save();epargne();document.getElementById('epm').textContent='Retrait de '+fmt(v)+' enregistré.'}
const MO=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fdl=s=>{if(!s)return'–';const[y,m,d]=s.split('-').map(Number);return(d===1?'1er':d)+' '+MO[m-1]+' '+y};
const lastDay=t=>t.end?addP(t.end,'quotidienne',-1):null;
const drawEvery=t=>t.de||nP(t);
const goalOf=t=>t.goal>0?t.goal:t.amount*nP(t);
const potDraw=t=>t.amount*t.members.length*drawEvery(t);
const nDraws=t=>Math.max(1,Math.floor(nP(t)/drawEvery(t)));
const drawDate=(t,k)=>addP(t.start||new Date().toISOString().slice(0,10),'quotidienne',k*drawEvery(t));
function startCd(t){clearInterval(window.cdT);const el=document.getElementById('cdbox');if(!el)return;const N=nDraws(t),k=t.draws.length+1;if(k>N){el.textContent='Tous les tirages prévus ont été effectués.';return}const dt=drawDate(t,k),target=new Date(dt+'T00:00:00').getTime();const tick=()=>{const e=document.getElementById('cdbox');if(!e){clearInterval(window.cdT);return}const ms=target-Date.now();if(ms<=0){e.innerHTML=`Tirage n° ${k} sur ${N} : prévu le <b>${fdl(dt)}</b> · <b>le tirage peut être lancé</b>`;return}const s=Math.floor(ms/1000),d=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;e.innerHTML=`Tirage n° ${k} sur ${N} : <b>${fdl(dt)}</b><br>Compte à rebours : <b>${d} j ${String(hh).padStart(2,'0')} h ${String(mm).padStart(2,'0')} min ${String(ss).padStart(2,'0')} s</b>`};tick();window.cdT=setInterval(tick,1000)}
function ctVals(){const g=id=>document.getElementById(id),a=+g('ta').value,m=+g('tm').value,s=g('ts').value,n=+g('tdn').value,u=+g('tdu').value;let de=+g('tdf').value;g('tdc').style.display=de===0?'':'none';if(de===0)de=Math.floor(+g('tdc').value);return{a,m,s,g:+g('tg').value||0,days:n>0?Math.floor(n*u):0,de}}
function mkT(id,n,v){return{id,name:n,amount:v.a,goal:v.g>0&&v.g!==v.a*v.days?v.g:0,freq:'quotidienne',max:v.m,start:v.s,end:addP(v.s,'quotidienne',v.days),days:v.days,de:v.de,round:1,members:[],pay:{},draws:[]}}
let ctSrc='a';
function ctEdit(w){ctSrc=w;ctPrev()}
function ctSync(){const v=ctVals(),G=id=>document.getElementById(id);v.note='';if(v.days>0){if(ctSrc==='g'){if(v.g>0){v.a=Math.round(v.g/v.days);G('ta').value=v.a;if(v.g%v.days)v.note=`${fmt(v.g)} ÷ ${v.days} jours = ${(v.g/v.days).toFixed(2)} F par jour, arrondi à ${fmt(v.a)}`}}else if(v.a>0){v.g=v.a*v.days;G('tg').value=v.g}}return v}
function ctPrev(){const v=ctSync(),el=document.getElementById('ctp');if(!v.days||!v.a||!v.m||!v.s||!(v.de>0)){el.textContent='Remplissez les champs : la cotisation par jour et la cotisation totale se calculent automatiquement l’une à partir de l’autre.';return}const N=Math.floor(v.days/v.de),t1=v.g>0?v.g:v.a*v.days;el.innerHTML=(N<1?'La fréquence du tirage dépasse la durée de la Tégue.':`Fin : <b>${fdl(addP(v.s,'quotidienne',v.days-1))}</b> · ${v.days} jours<br>Cotisation par personne et par jour : <b>${fmt(v.a)}</b><br>Cotisation totale par personne (toute la Tégue) : <b>${fmt(t1)}</b>${t1===v.a*v.days?` (${fmt(v.a)} × ${v.days} jours)`:''}<br>Total de la Tégue pour ${v.m} membre(s) : <b>${fmt(t1*v.m)}</b><br><b>${N}</b> tirage(s) prévu(s) · cagnotte par tirage : <b>${fmt(v.a*v.m*v.de)}</b> (${fmt(v.a)} × ${v.m} membres × ${v.de} jour(s))`)+(v.note?`<br><b>Arrondi :</b> ${v.note}`:'')}
function createT(){const v=ctSync(),n=document.getElementById('tn').value.trim(),el=document.getElementById('ctp');if(!isA())return;if(!n||!v.a||!v.m||!v.s||!v.days||!(v.de>0)){el.textContent='Remplissez tous les champs : nom, cotisation, participants, début, durée et fréquence du tirage.';return}if(v.de>v.days){el.textContent='La fréquence du tirage dépasse la durée de la Tégue.';return}const id='t'+Date.now();S.tontines.push(mkT(id,n,v));S.cur=id;save();admin()}
const expNow=t=>Math.min(goalOf(t),t.amount*elapsed(t));
function gapHtml(t,id){const g=tot(t,id)-expNow(t);return g>=0?`<span style="color:var(--g2)"><b>+${fmt(g)}</b> d’avance</span>`:`<span style="color:var(--r)"><b>−${fmt(-g)}</b> de retard</span>`}
function toggleBen(id){if(!isA())return;const t=T();t.ben=t.ben||{};if(t.ben[id])delete t.ben[id];else t.ben[id]=1;save();admin()}
function goS(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
function toggleLate(id){if(!isA())return;const t=T();t.lt=t.lt||{};if(t.lt[id])delete t.lt[id];else{t.lt[id]=1;notify(`${nm(t,id)} est en retard de cotisation.`)}save();admin()}
function conf(b,fn){if(b.dataset.s){fn();return}b.dataset.s=1;const o=b.textContent;b.textContent='Confirmer ?';setTimeout(()=>{b.dataset.s='';b.textContent=o},3500)}
function epCancel(b,id){if(!isA())return;conf(b,()=>{const E=S.ep,d=E.dep.find(x=>x.id===id);if(!d)return;const bal=E.dep.filter(x=>x.m===d.m&&x.id!==id).reduce((s,x)=>s+x.amount,0)-E.out.filter(o=>o.m===d.m).reduce((s,o)=>s+o.amount,0);if(bal<0){document.getElementById('epm').textContent='Impossible : cette somme a déjà été en partie restituée.';return}E.wd=E.wd||[];E.wd.push({name:(E.mem.find(x=>x.id===d.m)||{name:'?'}).name,m:d.m,amount:d.amount,dep:d.time,time:new Date().toISOString(),kind:'Dépôt retiré'});E.dep=E.dep.filter(x=>x.id!==id);save();epargne()})}
function epDel(b,id){if(!isA())return;conf(b,()=>{const E=S.ep,m=E.mem.find(x=>x.id===id);if(!m)return;E.rm=E.rm||[];E.rm.push({name:m.name,dep:E.dep.filter(x=>x.m===id).reduce((s,x)=>s+x.amount,0),out:E.out.filter(x=>x.m===id).reduce((s,x)=>s+x.amount,0),time:new Date().toISOString()});E.wd=E.wd||[];E.dep.filter(x=>x.m===id).forEach(x=>E.wd.push({name:m.name,m:id,amount:x.amount,dep:x.time,time:new Date().toISOString(),kind:'Épargnant retiré'}));E.out.filter(x=>x.m===id).forEach(x=>E.wd.push({name:m.name,m:id,amount:x.amount,dep:null,time:x.time,kind:x.kind||'Restitution'}));E.mem=E.mem.filter(x=>x.id!==id);E.dep=E.dep.filter(x=>x.m!==id);E.out=E.out.filter(x=>x.m!==id);save();epargne()})}
nav();
</script></body></html>
